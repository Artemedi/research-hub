name: Repository integrity

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify independent research closure ledger
        run: python3 experiments/research-portfolio/2026-11-09-ledger-independent-check.py --check
      - name: Check script syntax
        run: |
          node --check scripts/build-catalog.mjs
          node --check scripts/check.mjs
          node --check scripts/check.test.mjs
          node --check scripts/entity-model.mjs
          node --check scripts/entity-model.test.mjs
          node --check scripts/document-assessment.test.mjs
      - name: Check repository and generated catalog
        run: node scripts/check.mjs
      - name: Test integrity failures
        run: node --test scripts/check.test.mjs scripts/entity-model.test.mjs scripts/document-assessment.test.mjs
      - name: Check whitespace
        run: git diff --check HEAD^ HEAD
